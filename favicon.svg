<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <!-- lafspline: a wide, asymmetric gray confidence band and the least ambitious fit (blue) inside it: level, then
         one bend, then straight. Drawn to read at 16 px: no points, the band filling most of the tile. Colors are the
         app's light and dark theme tokens. -->
    <style>
        .bg { fill: #fcfcfb; stroke: #d9d8d3; }
        .band { fill: #52514e; fill-opacity: 0.3; }
        .fit { fill: none; stroke: #2a78d6; }
        @media (prefers-color-scheme: dark) {
            .bg { fill: #1a1a19; stroke: #3a3a37; }
            .band { fill: #c3c2b7; fill-opacity: 0.34; }
            .fit { stroke: #5b9cf0; }
        }
    </style>
    <rect class="bg" x="0.5" y="0.5" width="31" height="31" rx="7" stroke-width="1"/>
    <path class="band" d="M3 9.5 C5.5 9 7.5 8.3 9.5 8.6 C11.8 9 13 12.5 15.2 12.5 C17.4 12.5 18.5 7.5 21.5 5.6
        C24 4 26.5 3.2 29 3 L29 15 C25 15.5 22 18 18 22.5 S9 28.5 3 28.5 Z"/>
    <path class="fit" d="M3.5 21.5 L11 21 Q14.5 20.7 17.5 17 L28.5 7.5" stroke-width="2.6" stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>
